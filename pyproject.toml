[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "visionguard"
version = "0.0.1"
description = "Industrial anomaly detection under distribution shift: when does a pretrained-feature detector keep working, and how few reference images does it need to recover?"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "numpy>=2.0",
  "pillow>=10.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Heavy deps live in extras so data/metrics code and CI stay light.
# On Kaggle/Colab, torch is preinstalled; these bounds keep whatever is there.
models = ["torch>=2.1", "timm>=1.0"]
demo = ["gradio>=4.0"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY", "SIM"]
