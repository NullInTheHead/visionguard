# Settings shared by every experiment; experiment configs extend this file.
# Paths are relative to the repository root.
data:
  root: data/mvtec_anomaly_detection
  split: configs/split.yaml

# Reference / calibration split of each category's defect-free training images
# (protocol 2.2, decision D3). 0.0 = every training image is a reference image,
# which is the published PatchCore protocol (used for the anomalib comparison).
calibration:
  fraction: 0.1
  seed: 0
  margin: 0.13          # threshold = (1 + margin) x max calibration score; frozen (protocol v1.1)

few_shot:
  ks: [1, 2, 4, 8]      # plus k=0 (E2a) and "all" (E1) as the two ends of the curve
  seeds: [0, 1, 2, 3, 4]

device: auto            # auto = cuda, then Apple mps, then cpu
